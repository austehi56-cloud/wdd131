<html lang="en">

<head>

<body>
    <main>
        <h1>Lazy Loading Demonstration</h1>

        <img src="images/Simi.webp" alt="Portrait description 1" width="400" height="600" loading="lazy">
        <p>Note: This is my beautiful daughter Simi.</p>
        <img src="images/julaust.webp" alt="Portrait description 2" width="400" height="600" loading="lazy">
        <img src="images/julie.webp" alt="Portrait description 3" width="400" height="600" loading="lazy">

        <img src="images/love.webp" alt="Portrait description 5" width="400" height="600" loading="lazy">
        <img src="images/juliet.webp" alt="Portrait description 6" width="400" height="600" loading="lazy">
    </main>
