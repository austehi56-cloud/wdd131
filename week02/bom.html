<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book of Mormon - Top 10</title>
  <meta name="description" content="A simple application to store favorite Book of Mormon chapters.">
  <meta name="author" content="Austin Oluwatosin Aigbadon">
  <link rel="stylesheet" href="styles/bom.css">
  <script src="scripts/bom.js" defer></script>
</head>

<body>
  <h1>📖 Book of Mormon - Top 10</h1>
  <main>
    <div class="input-container">
      <label for="favchap">Enter Book and Chapter: </label>
      <input type="text" id="favchap" placeholder="Alma 5" required>
      <button type="submit" id="add-btn">Add Chapter</button>
    </div>
    <ul id="list"></ul>
  </main>
</body>

</html>
